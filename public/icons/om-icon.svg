<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="sacredGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#C2410C" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with Sacred Devotional Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#sacredGrad)" />
  <circle cx="256" cy="256" r="226" fill="#FFF8E7" />
  <circle cx="256" cy="256" r="214" fill="url(#sacredGrad)" opacity="0.12" />
  <circle cx="256" cy="256" r="204" fill="none" stroke="#FF6B00" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Sacred 108 Bead Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6" />

  <!-- Sacred OM Symbol (Deity glyph) -->
  <text x="256" y="325" font-family="'Noto Sans Devanagari', 'Arial Unicode MS', sans-serif" font-size="220" font-weight="bold" text-anchor="middle" fill="#FF6B00" filter="url(#glow)">ॐ</text>
  <text x="256" y="325" font-family="'Noto Sans Devanagari', 'Arial Unicode MS', sans-serif" font-size="220" font-weight="bold" text-anchor="middle" fill="#FF6B00">ॐ</text>
  <text x="256" y="325" font-family="'Noto Sans Devanagari', 'Arial Unicode MS', sans-serif" font-size="220" font-weight="bold" text-anchor="middle" fill="#FFD700" opacity="0.3">ॐ</text>
</svg>
